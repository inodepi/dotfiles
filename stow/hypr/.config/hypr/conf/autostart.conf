# ~/.config/hypr/conf/autostart.conf

# --- Core System Services ---
exec-once = ~/.config/hypr/scripts/start-session-services.sh  # systemd session target + waybar (supervised)
exec-once = hyprpaper
exec-once = hypridle                                 # Idle: dim -> lock -> dpms off -> suspend
# exec-once = ~/.config/waybar/scripts/caffeine.sh on  # Caffeine defaults OFF so the idle/lock chain actually runs; toggle with Super+C
# exec-once = swaync

# For GTK4 / Libadwaita apps (forces preferred dark color scheme)
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# For GTK3 apps
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
