# ~/.config/hypr/conf/keybinds.conf

$mainMod = SUPER

# --- binds ---
bind = $mainMod, T, exec, [workspace 2] kitty       # Super + T opens Kitty on workspace 2
bind = $mainMod, R, exec, wofi --show drun          # Super + R opens Wofi App Launcher
bind = $mainMod, B, exec, [workspace 1] brave-browser # Super + B opens Brave on workspace 1
bind = $mainMod, Q, killactive,                     # Super + Q closes the active window
bind = $mainMod, M, exec, ~/.local/bin/power-menu # Power menu: lock, logout, suspend, reboot, shutdown
bind = $mainMod, E, exec, [workspace 3] kitty --class yazi yazi # Super + E opens Yazi on workspace 3
bind = $mainMod, L, exec, hyprlock                  # Lock screen with SUPER + L
bind = $mainMod SHIFT, T, exec, kitty --class btop-float -e btop # Launch floating btop with Super + Shift + T
bind = $mainMod SHIFT, D, exec, [workspace 4] motrix # Open Motrix on workspace 4
bind = $mainMod, D, exec, ~/.config/hypr/scripts/discord-ws5.sh # Open/focus Discord on workspace 5

# --- Caffeine Mode (keep screen awake) ---
bind = $mainMod, C, exec, ~/.config/waybar/scripts/caffeine.sh toggle   # Toggle caffeine mode (keep screen awake)

# cheat sheet

bind = $mainMod, grave, exec, hypr-cheatsheet  # Open interactive keybinds cheatsheet

# --- Fast System Refresh Shortcut ---
bind = $mainMod SHIFT, R, exec, hyprctl reload      # Super + Shift + R refreshes all configs instantly

# --- Hardware System Controls (ThinkPad E14) ---

# Volume Controller Buttons (WirePlumber)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Screen Brightness Buttons (brightnessctl)
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ==========================================
# WORKSPACE KEYBINDS & ANIMATIONS
# ==========================================

# 1. Switch workspaces with SUPER + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# 2. Move active window to a workspace with SUPER + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# 3. Workspace swipe animation lives in theme.conf (animations block).
# Toggle clean Monocle Mode / Fullscreen layout (SUPER + F)
bind = $mainMod, F, fullscreen, 0

# hyprshot (screenshot)
bind = $mainMod SHIFT, S, exec, hyprshot -m region --clipboard-only  # Screenshot a region (selected area) and copy to clipboard
bind = $mainMod, PRINT, exec, hyprshot -m window                     # Screenshot the active window
bind = , PRINT, exec, hyprshot -m output                             # Screenshot the whole monitor output
