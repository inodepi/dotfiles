# hyprlock.conf — inodepi Tokyo Night
# Matches the inodepi SDDM + GRUB themes (base #1a1b26, accent #7aa2f7).

general {
    hide_cursor = false
}

background {
    monitor =
    path = /home/kristiandyan/.config/hypr/inodepi-lock.jpg
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 0
    noise = 0.0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# Latte square bullet beside the date
shape {
    monitor =
    size = 6, 6
    color = rgba(122, 162, 247, 1.0)
    rounding = 0
    border_size = 0
    position = 84, 198
    halign = left
    valign = bottom
}

# Date — bottom left, above the clock
label {
    monitor =
    text = cmd[update:60000] sh -c 'printf "<b>%s</b>" "$(date +"%A, %B %-d" | tr a-z A-Z)"'
    color = rgba(169, 177, 214, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 101, 190
    halign = left
    valign = bottom
}

# Clock — bottom left
label {
    monitor =
    text = <b>$TIME</b>
    color = rgba(192, 202, 245, 1.0)
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    position = 84, 84
    halign = left
    valign = bottom
}

# Username — bottom right, above the password field
label {
    monitor =
    text = cmd[update:3600000] sh -c 'printf "<b>%s</b>" "$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1 | tr a-z A-Z)"'
    color = rgba(192, 202, 245, 1.0)
    font_size = 31
    font_family = JetBrainsMono Nerd Font
    position = -84, 181
    halign = right
    valign = bottom
}

# Password field — rounded Tokyo Night box
input-field {
    monitor =
    size = 450, 72
    outline_thickness = 2
    rounding = 11
    inner_color = rgba(36, 40, 59, 1.0)
    outer_color = rgba(86, 95, 137, 1.0)
    font_color = rgba(122, 162, 247, 1.0)
    font_family = JetBrainsMono Nerd Font
    dots_text_format = ─
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    swap_font_color = 1
    capslock_color = rgba(247, 118, 142, 1.0)
    check_color = rgba(122, 162, 247, 1.0)
    placeholder_text = <span foreground="##565f89">password...</span>
    fail_text = <span foreground="##f7768e">ACCESS DENIED</span>
    fail_color = rgba(247, 118, 142, 1.0)
    position = -84, 84
    halign = right
    valign = bottom
}
