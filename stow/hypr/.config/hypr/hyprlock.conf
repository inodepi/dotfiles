background {
    monitor =
    color = rgba(26, 27, 38, 1.0)
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    
    fill_color = rgba(36, 40, 59, 1.0)
    font_color = rgba(192, 202, 245, 1.0)
    
    outer_color = rgba(122, 162, 247, 1.0)
    inner_color = rgba(36, 40, 59, 1.0)
    capslock_color = rgba(247, 118, 142, 1.0)

    fail_text = <i>$FAIL</i>
    fail_color = rgba(247, 118, 142, 1.0)
    check_color = rgba(158, 206, 106, 1.0)
    
    placeholder_text = Password...
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "$(date +"%a %b %d")"
    color = rgba(86, 95, 137, 1.0)
    font_size = 16
    font_family = monospace
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>"
    color = rgba(187, 154, 247, 1.0)
    font_size = 64
    font_family = monospace
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(169, 177, 214, 1.0)
    font_size = 18
    font_family = monospace
    position = 0, -110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] sh -c 'echo "$(cat /sys/class/power_supply/BAT0/capacity)% $(cat /sys/class/power_supply/A*/online | grep -q 1 && echo -n charging)"'
    color = rgba(86, 95, 137, 1.0)
    font_size = 13
    font_family = monospace
    position = 0, 40
    halign = center
    valign = bottom
}
