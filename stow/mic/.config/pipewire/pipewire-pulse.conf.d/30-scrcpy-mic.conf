# scrcpy phone microphone over Wi-Fi.
#
#   scrcpy --no-video --no-window --audio-source=mic --(plays)--> Scrcpy_Sink
#   Scrcpy_Sink.monitor --(remap)--> Scrcpy_Mic  <-- apps select this
pulse.cmd = [
    { cmd = "load-module"
      args = "module-null-sink sink_name=Scrcpy_Sink sink_properties=device.description=Scrcpy_Sink"
      flags = [ nofail ] }
    { cmd = "load-module"
      args = "module-remap-source master=Scrcpy_Sink.monitor source_name=Scrcpy_Mic source_properties=device.description=Scrcpy_Mic"
      flags = [ nofail ] }
]
